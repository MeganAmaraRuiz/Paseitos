<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/estilos.css">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paseitos</title>
</head>
<body>
    <header>
        <div id="bloquetitulos">
            <h1 id="titulo"><b>Patitas ligeras</b></h1>
            <p id="subtitulo"><i><u>Lo que tu perro merece</u></i></p>
        </div>
        <div id="perrito"></div>

    </header>
    <nav>
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="" class="nav-link">Galeria de fotos</a>
        <a href="" class="nav-link">Quienes somos</a>
        <a href="" class="nav-link">Contacto</a>
    </nav>
    <main>
        <script>
            localStorage.clear(); /*Esto es para que no queden registros de los datos anteriores*/
            sessionStorage.clear(); /*Lo mismo que lo anterior*/
        </script>
        <div id="tituloform">
            <h2 class="servicios">Dejanos tu consulta y te respondemos lo antes posible!</h2>

        </div>
        <div>
            <form action="https://formspree.io/f/mjykgyzy" method="POST" target="_blank" novalidate>
                <table id="tabla">
                    <tr>
                        <td><label for="nombre">Nombre: </label></td>
                        <td><input type="text" size="80" maxlength="50" id="nombre" name="nombre" placeholder="Ej. Cristiano Ronaldo" pattern="[A-Za-z]+" required></td>
                    </tr>
                    <tr>
                        <td><label for="e-mail">E-mail: </label></td>
                        <td><input type="email" size="60" id="e-mail" name="e-mail" placeholder="email@ejemplo.com" required></td>
                    </tr>
                    <tr>
                        <td><label for="consulta">Consulta: </label></td>
                        <td>
                            <textarea id="consulta" name="consulta" rows="15" cols="40" placeholder="Escribì tu consulta aquì..." required></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td align="right"><input type="submit" value="Enviar"></td>
                        <td align="right"><input type="reset" value="Borrar todos los campos"></td>
                    </tr>
                </table>
            </form>
            <input type="hidden" name="_redirect" value="gracias.html"> <!--Se intento redirigir a otra pagina lo de formspree, pero no funciono-->
        </div> 

    </main>
    <footer>
        <p><u>Contacto:</u><br><br>Cel: 1130460651</p><br> 
        <p>Mail: <a href="">paseitos@gmail.com</a></p>
    </footer>
</body>
